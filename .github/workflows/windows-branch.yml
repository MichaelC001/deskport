name: Windows source checks

on:
  push:
    branches: [main, dev/windows]
  pull_request:
    branches: [main, dev/windows]
  workflow_dispatch:

concurrency:
  group: windows-branch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Validate Windows build scripts
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/deskport-python-cache
          DESKPORT_TEST_DIR: ${{ runner.temp }}/deskport-windows-tests
        run: |
          set -euo pipefail
          find winbuild/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 -m compileall -q winbuild/scripts
          python3 winbuild/scripts/test-build-paths.py
          python3 winbuild/scripts/test-host-boost.py
          # A store-root rejection guard is valid; concrete store dependencies are not.
          if grep -R -nE --exclude-dir=__pycache__ '/nix/store/|/run/current-system' winbuild/scripts; then
            echo "Windows build scripts must not depend on machine-specific Nix paths." >&2
            exit 1
          fi

      - name: Shared smart-stream regressions
        run: |
          python3 tests/test-smart-stream.py
          python3 tests/test-host-network.py

      - name: Translation consistency
        run: |
          python3 tests/test-translations.py
          python3 tests/test-browser-translations.py
